<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B2BD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Касса КМЗ">
<title>Касса КМЗ</title>
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="icons/favicon-64.png?v=1" sizes="64x64"><link rel="icon" href="favicon.ico?v=1" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--soft:#EEF1F6;--soft2:#F6F8FC;--line:#E1E6EE;--ink:#1B2433;--ink2:#4A5C8C;--mute:#8C98B8;--head:#12307E;--acc:#2350E6;--accbg:#EAF0FF;
--ok:#12875B;--okbg:#E2F4EC;--red:#D8412F;--redbg:#FCE9E4;--amb:#9A6300;--ambbg:#FFF4DA;--vio:#6A3BE0;--viobg:#F0EBFF;--edit:#FFF8E6;
--shadow:0 1px 2px rgba(18,48,126,.05),0 6px 20px -10px rgba(18,48,126,.22);--glass:rgba(243,245,248,.9);--f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--d:"Unbounded","Onest",system-ui,sans-serif;--grad:linear-gradient(135deg,#8B6BFF 0%,#5B2BD6 48%,#2350E6 100%);--gsh:0 14px 34px -14px rgba(91,43,214,.65)}
:root[data-theme=dark]{--bg:#0B0F1A;--card:#141A28;--soft:#1B2233;--soft2:#171E2D;--line:#252E42;--ink:#E8EDF8;--ink2:#A9B6D6;--mute:#6F7C9C;--head:#C9D6FF;--acc:#6F8FFF;--accbg:#1D2744;
--ok:#43C98F;--okbg:#12301F;--red:#FF7A68;--redbg:#3A1C19;--amb:#F0B84F;--ambbg:#352914;--vio:#B39BFF;--viobg:#271E45;--edit:#2F2812;
--shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -12px rgba(0,0,0,.6);--glass:rgba(11,15,26,.9)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px}
body{min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.num,.kv b,td,.cv{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto}
/* top */
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.bar1{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none;font-weight:800;color:var(--head)}
.ib:disabled{opacity:.35}
.bur i{display:block;width:18px;height:2px;background:var(--head);box-shadow:0 5px 0 var(--head),0 -5px 0 var(--head)}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:18px;color:var(--head);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.dot.ok{background:var(--ok)}.dot.wait{background:#E0A100}.dot.err{background:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kv{background:var(--card);border-radius:14px;padding:7px 9px;box-shadow:var(--shadow);min-width:0}
.kv span{display:block;font-size:10.5px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv b{font-size:15.5px;color:var(--head);font-weight:800;white-space:nowrap}
.kv.g{background:var(--okbg)}.kv.g b,.kv.g span{color:var(--ok)}
.kv.y{background:var(--ambbg)}.kv.y b,.kv.y span{color:var(--amb)}
.kv.r{background:var(--redbg)}.kv.r b,.kv.r span{color:var(--red)}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:8px}
.tabs button{flex:1;text-align:center;font-size:13px;font-weight:700;padding:7px;border-radius:9px;color:var(--ink2)}
.tabs .on{background:var(--card);color:var(--head);box-shadow:var(--shadow)}
/* banners */
.ban{margin:8px 12px 0;border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.ban.lock{background:var(--okbg);color:var(--ok);font-weight:600}
.ban.lock button{margin-left:auto;background:var(--card);border-radius:10px;padding:6px 10px;font-weight:700;color:var(--head)}
.hints{margin:8px 12px 0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.hints h4{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px 4px;display:flex;justify-content:space-between}
.hint{padding:7px 12px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:center;line-height:1.35}
.hint i{font-style:normal;flex:none}
.hint button{margin-left:auto;flex:none;background:var(--accbg);color:var(--acc);border-radius:9px;padding:5px 9px;font-weight:700;font-size:12px}
/* layout */
.main{padding:8px 10px 0}
.cols{display:block}
.sec{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.04em;margin:10px 6px 6px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec .r{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.lnk{color:var(--acc);font-weight:700;font-size:12.5px}
.box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tool{display:flex;gap:6px;margin:0 2px 8px;align-items:center}
.tool input{flex:1;min-width:0;background:var(--card);border:0;border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);outline:none}
.tool select{background:var(--card);border:0;border-radius:12px;padding:9px 8px;box-shadow:var(--shadow);font-weight:600;color:var(--ink2)}
.um{font-size:12px;font-weight:700;background:var(--ambbg);color:var(--amb);border-radius:10px;padding:8px 9px;white-space:nowrap}
.um.on{outline:2px solid var(--amb)}
/* phone rows */
.cl{display:grid;grid-template-columns:1fr auto 64px;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.cl:last-child{border-bottom:0}
.cl .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .nm small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.cl .cv{font-weight:800;color:var(--head);text-align:right}
.cl.unm{box-shadow:inset 3px 0 0 #E0A100}
.cl.unm .cv{opacity:.75}
.cl.flash,.xr.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{background:var(--edit)}100%{background:transparent}}
.grp{background:var(--soft2);font-size:11.5px;font-weight:800;color:var(--ink2);padding:6px 12px;border-bottom:1px solid var(--line)}
.chip{font-size:11.5px;font-weight:700;border-radius:9px;padding:6px 0;text-align:center;width:100%;display:block}
.chip.n{background:var(--okbg);color:var(--ok)}.chip.c{background:var(--accbg);color:var(--acc)}.chip.z{background:var(--soft);color:var(--mute)}
.chip.m{background:linear-gradient(90deg,var(--okbg) 50%,var(--accbg) 50%);color:var(--ink2)}
.chip.p{background:var(--ambbg);color:var(--amb)}
.foot{display:flex;justify-content:space-between;padding:10px 12px;font-weight:800;color:var(--head);background:var(--accbg)}
.empty{padding:22px 14px;text-align:center;color:var(--mute)}
.addrow{display:block;width:100%;padding:11px;text-align:center;color:var(--acc);font-weight:700;border-top:1px solid var(--line)}
/* excel table */
.xt{width:100%;border-collapse:collapse;font-size:13.5px}
.xt th{background:var(--soft2);color:var(--mute);font-size:11px;font-weight:700;padding:7px 6px;text-align:right;white-space:nowrap}
.xt th:nth-child(2){text-align:left}
.xt td{border-top:1px solid var(--line);padding:0;text-align:right;white-space:nowrap}
.xt td.i{color:var(--mute);font-size:11px;text-align:center;width:30px;cursor:pointer}
.xt td.g{font-weight:800;color:var(--head);padding:0 8px}
.xt td.k{width:74px;padding:3px 4px}
.xt td.x{width:30px;text-align:center}
.xt td.x button{color:var(--red);opacity:.5;font-weight:800;padding:6px}
.xt td.x button:hover{opacity:1}
.xt input{width:100%;min-width:60px;border:0;background:transparent;padding:8px;text-align:right;outline:none;border-radius:0}
.xt input.nm{text-align:left;font-weight:600;min-width:170px}
.xt input:focus{background:var(--edit);box-shadow:inset 0 0 0 2px #F5B700}
.xt input.dim{color:var(--mute)}
.xt .ds{display:block;font-size:9.5px;color:var(--mute);text-align:right;padding:0 8px;margin-top:-6px;height:10px}
.xt tr.unm td:nth-child(2){box-shadow:inset 3px 0 0 #E0A100}
.xt tr.f td{background:var(--accbg);font-weight:800;color:var(--head);padding:9px 8px}
.xt input:disabled{color:var(--ink)}
/* opis */
.op{display:grid;grid-template-columns:70px 1fr 92px;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.op .d{font-weight:800;color:var(--head)}
.op .s{text-align:right;font-weight:700}
.st{display:flex;align-items:center;background:var(--soft);border-radius:11px;overflow:hidden;max-width:150px}
.st button{width:36px;height:34px;font-weight:800;color:var(--acc);font-size:17px;flex:none}
.st input{width:100%;min-width:30px;text-align:center;border:0;background:var(--card);height:34px;font-weight:700;outline:none}
.op .in,.oin{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 8px;text-align:right;font-weight:700;outline:none}
.op .in:focus,.oin:focus,.st input:focus{box-shadow:0 0 0 2px #F5B700}
.op.t{background:var(--soft2)}.op.t .d,.op.t .s{color:var(--head);font-weight:800}
.op.o{grid-template-columns:1fr 110px 28px}
.op.o input.on{text-align:left;font-weight:600}
.op .x{color:var(--red);opacity:.55;font-weight:800}
.op small{font-size:10.5px;color:var(--mute);font-weight:600;display:block}
.sw{display:inline-flex;background:var(--soft);border-radius:9px;padding:2px}
.sw button{font-size:11px;font-weight:700;padding:4px 7px;border-radius:7px;color:var(--mute)}
.sw .on{background:var(--card);color:var(--head)}
/* bottom bar */
.bb{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:9px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bb .dz{flex:1;font-size:11.5px;color:var(--mute);min-width:0}.bb .dz b{display:block;font-size:17px}
.btn{background:var(--acc);color:#fff;font-weight:700;border-radius:13px;padding:11px 13px;font-size:13.5px;white-space:nowrap}
.btn.v{background:var(--viobg);color:var(--vio)}
.btn.s{background:var(--soft);color:var(--head)}
.btn.r{background:var(--redbg);color:var(--red)}
.btn.g{background:var(--okbg);color:var(--ok)}
.btn:disabled{opacity:.4}
/* drawer */
.scr{position:fixed;inset:0;background:rgba(8,14,30,.4);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scr.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);background:var(--bg);z-index:41;transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.dr.on{transform:none}
.drh{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#9B7BFF,#5B2BD6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.drh b{display:block;color:var(--head);font-size:17px}.drh span{font-size:12px;color:var(--mute)}
.drb{flex:1;overflow:auto;padding:0 10px 20px}
.dm{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;font-weight:600;text-align:left}
.dm:hover{background:var(--soft)}
.dm i{font-style:normal;width:22px;text-align:center}
.dl{font-size:11px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:12px 12px 6px}
.ki{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:12px;text-align:left}
.ki.on{background:var(--card);box-shadow:var(--shadow)}
.kdel{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mute);font-weight:800;font-size:16px;flex:none}.kdel:hover{background:var(--redbg);color:var(--red)}
.ki .a{flex:1;min-width:0}.ki .a b{display:block;font-size:13.5px;color:var(--head)}.ki .a span{font-size:11.5px;color:var(--mute)}
.bd{font-size:11px;font-weight:800;border-radius:8px;padding:3px 7px;white-space:nowrap}
.bd.g{background:var(--okbg);color:var(--ok)}.bd.y{background:var(--ambbg);color:var(--amb)}.bd.r{background:var(--redbg);color:var(--red)}.bd.s{background:var(--soft);color:var(--mute)}
/* sheet */
.sh:not(.on){visibility:hidden}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.25s}
.sh.on{transform:none}
.shs{position:fixed;inset:0;background:rgba(8,14,30,.4);z-index:50;opacity:0;pointer-events:none;transition:.2s}.shs.on{opacity:1;pointer-events:auto}
@media(min-width:760px){.sh{left:50%;right:auto;width:620px;bottom:auto;top:50%;border-radius:22px;transform:translate(-50%,-40%) scale(.97);opacity:0;pointer-events:none;max-height:86vh}.sh.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.sht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.sht b{font-size:18px;color:var(--head)}
.lbl{font-size:12px;color:var(--mute);font-weight:600;margin:10px 0 5px}
.fi{width:100%;border:1px solid var(--line);background:var(--soft2);border-radius:12px;padding:11px 12px;outline:none;font-size:15px}
.fi:focus{border-color:var(--acc)}
textarea.fi{min-height:70px;resize:vertical;font-size:14px}
.pay{display:grid;grid-template-columns:1fr auto auto 32px;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 10px;margin-bottom:7px}
.pay input{border:0;background:transparent;font-weight:800;font-size:18px;color:var(--head);outline:none;width:100%;min-width:0}
.pay select{border:0;background:var(--soft);border-radius:9px;padding:6px 4px;font-size:12px;font-weight:600;color:var(--ink2);max-width:76px}
.tg{display:flex;background:var(--soft);border-radius:10px;padding:2px}
.tg button{font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px;color:var(--mute)}
.tg .n.on{background:var(--okbg);color:var(--ok)}.tg .c.on{background:var(--accbg);color:var(--acc)}
.xb{width:32px;height:32px;border-radius:9px;background:var(--redbg);color:var(--red);font-weight:800}
.add{display:block;width:100%;border:1.5px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--acc);font-weight:700;margin-bottom:8px}
.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.qk button{background:var(--soft);border-radius:11px;padding:10px 6px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.wn{font-size:12.5px;color:#B26A00;background:var(--ambbg);border-radius:10px;padding:6px 10px;margin:-3px 0 8px;line-height:1.35}
.in.bad{border-color:var(--red);color:var(--red)}
.xt input.warn{box-shadow:inset 0 -2px 0 #E0A100;color:#B26A00}
.row2{display:flex;gap:8px;margin-top:12px}.row2>*{flex:1;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2)}
.seg .on{background:var(--card);color:var(--head);box-shadow:var(--shadow)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12.5px;color:var(--mute);line-height:1.4;margin-top:6px}
.res{border-bottom:1px solid var(--line);padding:9px 2px;display:flex;gap:10px;align-items:center;cursor:pointer}
.res .a{flex:1;min-width:0}.res b{color:var(--head)}.res span{font-size:12px;color:var(--mute);display:block}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:92px 1fr 88px;gap:8px;align-items:center;font-size:12.5px}
.brow .t{height:14px;background:var(--soft);border-radius:6px;overflow:hidden}.brow .t i{display:block;height:100%;background:linear-gradient(90deg,#9B7BFF,#5B2BD6);border-radius:6px}
.brow b{text-align:right;color:var(--head)}
.stt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.stt td,.stt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.stt td:first-child,.stt th:first-child{text-align:left}
.stt th{font-size:11px;color:var(--mute)}
.log{font-size:12.5px;color:var(--ink2);padding:5px 0;border-bottom:1px dashed var(--line)}
.log span{color:var(--mute);margin-right:6px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#1B2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;opacity:0;transition:.25s;font-weight:600;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.repimg{width:100%;border-radius:14px;border:1px solid var(--line)}
.welcome{max-width:460px;margin:40px auto;padding:0 16px;text-align:center}
.welcome .logo{width:72px;height:72px;font-size:34px;margin:0 auto 14px;border-radius:20px}
.welcome h2{color:var(--head);margin-bottom:8px}.welcome p{color:var(--ink2);margin-bottom:16px;line-height:1.45}
.welcome .btn{display:block;width:100%;margin-bottom:8px}
/* wide */
@media(min-width:900px){
 body{padding-bottom:20px}
 .top{padding:12px 20px 10px}
 .bar1{gap:12px}
 .kpis{display:flex;margin:0;gap:8px}
 .kv{padding:6px 12px}
 .topw{display:flex;align-items:center;gap:12px}
 .tabs,.bb{display:none!important}
 .main{padding:10px 20px}
 .cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
 .pane{display:block!important}
 .ban,.hints{margin:10px 20px 0}
 #banners{padding:0}
 .wbtn{display:inline-flex!important}
}
.wbtn{display:none}
@media(min-width:1240px){.cols{grid-template-columns:minmax(0,2.3fr) minmax(330px,1fr)!important}}
@media(min-width:900px) and (max-width:1239px){.cols>.pane:last-child{max-width:560px}}

/* premium */
.tt{font-family:var(--f)}
.tt b{font-family:var(--d);font-weight:700;font-size:17px;letter-spacing:0}
.tt span{margin-top:2px}
.sht b,.drh b,.welcome h2{font-family:var(--d);letter-spacing:-.01em;font-weight:700}
.hero{margin:6px 12px 0;border-radius:22px;padding:16px 16px 14px;background:var(--grad);color:#fff;box-shadow:var(--gsh);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero:after{content:"₽";position:absolute;right:16px;top:6px;font:800 64px var(--d);color:rgba(255,255,255,.09)}
.hero span{display:block;font-size:11.5px;font-weight:600;opacity:.8;letter-spacing:.02em}
.hero .h1 b{display:block;font:700 30px var(--d);letter-spacing:0;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .h1 em{font-style:normal;font-size:12px;opacity:.75}
.hero .h2{display:flex;align-items:flex-end;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.hero .hm b{font:600 16px var(--d);letter-spacing:0;font-variant-numeric:tabular-nums}
.hero .hm{flex:1}
.dchip{border-radius:12px;padding:8px 12px;font:700 14px var(--d);letter-spacing:0;background:#fff;white-space:nowrap}
.dchip.g{color:#12875B}.dchip.y{color:#B26A00}.dchip.r{color:#D8412F}
.tabs{margin:10px 12px 0}
.tabs .on{color:var(--vio)}
.hints{box-shadow:var(--shadow)}
.hh{display:flex;gap:8px;align-items:center;width:100%;padding:10px 12px;text-align:left;font-size:13px}
.hh span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hh i{font-style:normal}.hh em{font-style:normal;font-weight:700;color:var(--vio);font-size:12px;white-space:nowrap}
.logoi{width:42px;height:42px;border-radius:12px;flex:none}
.sec{font-family:var(--f)}
.sec .r.num{font:700 13px var(--d);color:var(--head);letter-spacing:0}
.cl .cv,.xt td.g,.foot .num,.op .s,.op.t .s{font-family:var(--d);font-weight:600;letter-spacing:0;font-size:13.5px}
.btn{background:var(--grad);box-shadow:var(--gsh)}
.btn.v,.btn.s,.btn.r,.btn.g{box-shadow:none}
.bb .dz b{font-family:var(--d);letter-spacing:0}
.foot{background:var(--viobg);color:var(--vio)}
.op.t{background:var(--viobg)}.op.t .d,.op.t .s{color:var(--vio)}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;max-height:300px;overflow:auto}
.sugg .sl{grid-column:1/-1;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sugg button{background:var(--soft);border-radius:11px;padding:8px 11px;font-weight:600;font-size:13.5px;color:var(--head);text-align:left;line-height:1.15}
.sugg button small{display:block;font-size:10.5px;color:var(--vio);font-weight:700}
.sugg button:active{background:var(--viobg)}
@media(min-width:900px){.hero{margin:12px 20px 0;display:flex;align-items:center;gap:30px;padding:18px 24px}.hero .h2{margin:0;padding:0;border:0;flex:1;justify-content:flex-end;gap:28px}.hero .hm{flex:none}.hero:after{right:auto;left:46%}.tabs{display:none!important}}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div id="banners" class="wrap"></div>
<div class="main wrap" id="main"></div>
<div class="bb" id="bb"></div>

<div class="scr" id="scr"></div>
<aside class="dr" id="dr"></aside>
<div class="shs" id="shs"></div>
<div class="sh" id="sh"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
const DEN=[5000,2000,1000,500,200,100,50];
const LS='kmz-kassa-v1';
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n)||0).toLocaleString('ru-RU').replace(/ /g,' ');
const sgn=n=>n>0?'+'+fmt(n):n<0?'−'+fmt(-n):'0';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();
const cap=s=>{s=String(s||'').trim().replace(/\s+/g,' ');return s?s[0].toUpperCase()+s.slice(1):s};
function pnum(v){ // "1 200+300" -> 1500
  v=String(v==null?'':v).replace(/[\s ]/g,'').replace(/,/g,'.').replace(/−/g,'-');
  if(!v)return null; if(!/^[-+]?[\d.]+([+\-][\d.]+)*$/.test(v))return null;
  let t=0;(v.match(/[+\-]?[\d.]+/g)||[]).forEach(x=>t+=parseFloat(x)||0);return Math.round(t*100)/100}
// dates
const ds=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dm=s=>{const d=pd(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')};
const dmy=s=>dm(s)+'.'+pd(s).getFullYear();
const today=()=>ds(new Date());
function daysOf(k){const r=[];let d=k.start;let g=0;while(d<=k.end&&g<40){r.push(d);d=addD(d,1);g++}return r}
function ktitle(k){return k.start===k.end?dm(k.start):dm(k.start)+'–'+dm(k.end)}
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

/* ---------- state ---------- */
function blank(){return{v:1,kassas:[],clientsList:{text:'',upd:0},cur:null,dirty:false,settings:{url:'',key:'',theme:'',sort:'input',payday:4,sign:'ТП Подгорный',tab:'all'}}}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.kassas){const b=blank();s.settings=Object.assign(b.settings,s.settings||{});if(!s.settings.v2){s.settings.payday=4;s.settings.sign='ТП Подгорный';s.settings.v2=1}s.clientsList=s.clientsList||b.clientsList;return s}}catch(e){}return blank()}
let S=load();S.kassas.forEach(k=>{if(k.cardAuto){let c=0;(k.clients||[]).forEach(x=>x.sums.forEach(s=>{if(s.m==='c')c+=+s.a||0}));k.cardAuto=false;if(k.cardManual==null&&c)k.cardManual=c}});
let saveT=null;
function persist(noSync){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Не удалось сохранить в памяти телефона')}if(!noSync)scheduleSync()}
const live=()=>S.kassas.filter(k=>!k.deleted).sort((a,b)=>b.end.localeCompare(a.end)||b.start.localeCompare(a.start));
function K(){let k=S.kassas.find(x=>x.id===S.cur&&!x.deleted);if(!k){k=live()[0]||null;S.cur=k?k.id:null}return k}
function newKassa(o){const k={id:uid(),type:o.type||'week',start:o.start,end:o.end,status:'draft',clients:[],opis:{},coins:null,cardAuto:false,cardManual:null,
  out:[{id:uid(),name:'Зарплата',a:null},{id:uid(),name:'Аренда',a:null}],buh:{sum:o.buhSum==null?null:o.buhSum,mode:o.buhMode||'check'},log:[],upd:Date.now()};
  S.kassas.push(k);S.cur=k.id;return k}

/* ---------- totals ---------- */
function T(k){
  let zab=0,card=0,unm=0,nsum=0;
  k.clients.forEach(c=>c.sums.forEach(s=>{const a=+s.a||0;zab+=a;nsum++;if(s.m==='c')card+=a;if(!s.m&&a)unm++}));
  let cash=0;DEN.forEach(d=>cash+=d*(+k.opis[d]||0));cash+=(+k.coins||0);
  const cardV=+k.cardManual||0;
  let out=0;k.out.forEach(o=>out+=(+o.a||0));
  const opis=cash+cardV+out;
  const bs=k.buh&&k.buh.sum!=null?+k.buh.sum:null;
  const target=zab+(bs!=null&&k.buh.mode==='add'?bs:0);
  const diff=Math.round((opis-target)*100)/100;
  const buhDiff=bs!=null&&k.buh.mode==='check'?Math.round((zab-bs)*100)/100:null;
  return{zab,target,cash,card:cardV,cardMarked:card,out,opis,diff,unm,nsum,buhDiff,bs}}
const ctot=c=>c.sums.reduce((a,s)=>a+(+s.a||0),0);
const lvl=d=>d>=0?'g':'r';
function markOf(c){const ms=c.sums.filter(s=>+s.a).map(s=>s.m||'');if(!ms.length)return'z';
  const n=ms.includes('n'),cc=ms.includes('c'),z=ms.includes('');
  if(n&&cc)return'm';if(z&&(n||cc))return'p';if(n)return'n';if(cc)return'c';return'z'}
const MLBL={n:'Нал',c:'Карта',z:'—',m:'Н+К',p:'½'};

/* ---------- undo / mutate ---------- */
let undoSt=[];
function snap(){const k=K();if(!k)return;undoSt.push({id:k.id,j:JSON.stringify(k)});if(undoSt.length>60)undoSt.shift()}
function undo(){const u=undoSt.pop();if(!u)return;const i=S.kassas.findIndex(x=>x.id===u.id);if(i<0)return;const o=JSON.parse(u.j);o.upd=Date.now();S.kassas[i]=o;S.cur=o.id;persist();render();toast('Отменено')}
function locked(k){return false}
function logc(k,t){return;if(k.status==='done'||k.unlocked){k.log=k.log||[];k.log.push({t:Date.now(),x:t});if(k.log.length>300)k.log.shift()}}
function mut(fn,msg){const k=K();if(!k)return;if(locked(k)){askUnlock();return}snap();fn(k);k.upd=Date.now();if(msg)logc(k,msg);persist();render()}
function touch(k,msg){k.upd=Date.now();if(msg)logc(k,msg);clearTimeout(saveT);saveT=setTimeout(()=>persist(),600)}

/* ---------- hints ---------- */
function isVariant(a,b){ // b is transposition/one-digit typo of a
  a=String(Math.round(a));b=String(Math.round(b));if(a===b)return false;
  if(a.length===b.length){let d=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])d.push(i);
    if(d.length===1)return'цифра';if(d.length===2&&d[1]===d[0]+1&&a[d[0]]===b[d[1]]&&a[d[1]]===b[d[0]])return'перестановка'}
  if(Math.abs(a.length-b.length)===1){const[l,s]=a.length>b.length?[a,b]:[b,a];for(let i=0;i<l.length;i++)if(l.slice(0,i)+l.slice(i+1)===s)return a.length>b.length?'лишняя цифра':'пропущена цифра'}
  return false}
/* типовые ошибки кассы (по опыту ТП) */
function sumWarn(k,c,i){ // предупреждения по одной сумме при вводе
  const s=c.sums[i];const a=+s.a;if(!a)return'';const W=[];
  if(c.sums.some((x,j)=>j!==i&&+x.a===a))W.push('такая же сумма у клиента уже есть — не записал дважды?');
  const hist=[];S.kassas.forEach(kk=>{if(kk.deleted||kk.id===k.id)return;kk.clients.forEach(cc=>{if(norm(cc.name)===norm(c.name))cc.sums.forEach(x=>{if(+x.a)hist.push(+x.a)})})});
  if(hist.length){const mx=Math.max(...hist);if(a>mx*4&&a>5000)W.push('намного больше обычного ('+fmt(mx)+') — лишний ноль?');}
  if(a>=1000&&a%1000!==0&&String(Math.round(a)).length>=6&&a>300000)W.push('очень крупная сумма — проверь разряды');
  return W.join('; ')}
function clientWarn(k,c){return c.sums.some((s,i)=>sumWarn(k,c,i))}
function hints(k,t){
  const H=[];
  const seen={};k.clients.forEach(c=>{const n=norm(c.name);if(!n)return;(seen[n]=seen[n]||[]).push(c)});
  Object.values(seen).filter(a=>a.length>1).forEach(a=>H.push({i:'👥',t:`<b>${esc(a[0].name)}</b> записан ${a.length} раза — объединить?`,b:'Объединить',act:'merge:'+a.map(c=>c.id).join(',')}));
  k.clients.forEach(c=>c.sums.forEach((s,i)=>{const w=sumWarn(k,c,i);if(w)H.push({i:'⚠️',t:`<b>${esc(c.name)}</b> ${fmt(s.a)}: ${w}`,b:'Открыть',act:'editc:'+c.id})}));
  DEN.forEach(d=>{const n=+k.opis[d];if(n&&!Number.isInteger(n))H.push({i:'💵',t:`Опись ${fmt(d)}: сумма ${fmt(d*n)} не делится на ${fmt(d)} — пересчитай`})});
  if(+k.coins>1000)H.push({i:'🪙',t:`Монет ${fmt(k.coins)} ₽ — многовато, проверь, не купюры ли это`});
  const d=t.diff;
  if(d!==0){
    const ad=Math.abs(d);
    // исправление конкретной суммы: перестановка / подмена цифры
    k.clients.forEach(c=>c.sums.forEach((s,i)=>{const a=+s.a;if(!a)return;const cand=Math.round((a+d)*100)/100;if(cand<=0)return;const v=isVariant(a,cand);
      if(v)H.push({i:'✏️',t:`<b>${esc(c.name)}</b>: ${fmt(a)} → ${fmt(cand)}? (${v}) — тогда касса сойдётся`,b:'Исправить',act:`fix:${c.id}:${i}:${cand}`})}));
    const one=[];k.clients.forEach(c=>c.sums.forEach(s=>{if(+s.a===ad)one.push(c.name)}));
    one.slice(0,2).forEach(n=>H.push({i:'🔎',t:d<0?`Разница = сумме <b>${esc(n)}</b> (${fmt(ad)}) — записана лишний раз или деньги не положил в кассу?`:`Разница = сумме <b>${esc(n)}</b> (${fmt(ad)}) — эти деньги есть, а записаны ли?`}));
    if(d>0)H.push({i:'🧾',t:'Денег больше, чем записано — чаще всего <b>кого-то не записал</b>. Пройди по маршруту: все ли клиенты внесены?'});
    if(d<0)H.push({i:'🧾',t:'Денег меньше, чем записано — проверь, нет ли клиента, записанного дважды, и не забыл ли внести выдачу (зарплата, аренда)'});
    // купюры
    if(DEN.includes(ad))H.push({i:'💵',t:d<0?`Не хватает ровно ${fmt(ad)} — одну купюру ${fmt(ad)} не посчитал?`:`Лишние ровно ${fmt(ad)} — купюру ${fmt(ad)} посчитал дважды?`});
    else{const B=[];DEN.forEach(x=>{const n=Math.round(ad/x);if(n>=1&&n<=9&&Math.abs(ad-n*x)<=Math.max(60,x*.05))B.push(n+' × '+fmt(x))});
      if(B.length)H.push({i:'💵',t:`${sgn(d)} ≈ ${B.slice(0,2).join(' или ')} — пересчитай эти купюры`})}
    if(ad%9===0&&ad>=90&&ad<100000)H.push({i:'🔁',t:'Разница делится на 9 — похоже на <b>перестановку двух цифр</b> (как 25 592 → 25 952). Сверь суммы с запиской'});
    if(/^[1-9]0{2,}$/.test(String(ad)))H.push({i:'🔢',t:`Разница ${fmt(ad)} — похоже на <b>подмену одной цифры</b> (как 13 203 → 13 303). Сверь сотни и тысячи`});
    if([99,100,199,200].includes(ad)&&d<0)H.push({i:'💳',t:'Похоже на списания с карты (уведомления 99 ₽, связь 100 ₽) — вычти их из «Карты»'});
    if(ad<100)H.push({i:'🪙',t:'Меньше 100 ₽ — обычно монеты, сдача или округление. Пересчитай монеты'});
  }
  if(k.status!=='done'&&today()>addD(k.end,2))H.push({i:'📅',t:`Касса за ${ktitle(k)} ещё не сдана — сдать и начать новую?`});
  if(t.buhDiff)H.push({i:'📄',t:`Забрано ${t.buhDiff>0?'больше':'меньше'} суммы бухгалтерии на ${fmt(Math.abs(t.buhDiff))}`});
  return H.slice(0,10)}

/* ---------- routes from client list ---------- */
function routeMap(){const m=[];let r='Без маршрута';String(S.clientsList.text||'').split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){r=l.replace(/^#+\s*/,'')||r;return}m.push({n:norm(l),name:l,r})});return m}
function routeOf(name,m){const n=norm(name);if(!n)return'Без маршрута';let f=m.find(x=>x.n===n)||m.find(x=>x.n.startsWith(n)||n.startsWith(x.n));
  if(!f){const w=n.split(' ')[0];const c=m.filter(x=>x.n.split(' ')[0]===w);if(c.length===1||(c.length&&c.every(x=>x.r===c[0].r)))f=c[0]}return f?f.r:'Без маршрута'}
const SEED=['Щеглова','Еньшина','Кунгуров','Дуюнова Тепличная','Оводова','Стельмухова','Храпенкова','Садоян','Зигора','Саркисян Давид','Саркисян Сережа','Дуюнова Тихая','Каграманова','Кондрахина','Акопян','Махов'];
function freqNames(){const m={};SEED.forEach(n=>{m[norm(n)]={name:n,c:.5,last:''}});
  S.kassas.forEach(k=>{if(k.deleted)return;k.clients.forEach(c=>{const n=norm(c.name);if(!n)return;const o=m[n]=m[n]||{name:c.name,c:0,last:''};o.c++;if(k.end>=o.last){o.last=k.end;o.name=cap(c.name)}})});
  return Object.values(m).sort((a,b)=>b.c-a.c||a.name.localeCompare(b.name,'ru'))}
let lastSugg=[];
function suggHTML(k,c){const nq=norm(c.name);let arr=freqNames();
  if(nq){const all=[...arr];routeMap().forEach(x=>{if(!all.some(y=>norm(y.name)===x.n))all.push({name:x.name,c:0})});
    arr=all.filter(x=>{const n=norm(x.name);return n!==nq&&(n.startsWith(nq)||n.split(' ').some(w=>w.startsWith(nq)))})}
  arr=arr.slice(0,nq?8:16);lastSugg=arr;if(!arr.length)return'';
  return`<div class="sl">${nq?'Подходят':'Часто в кассе'}</div>`+arr.map((x,i)=>{const ex=k.clients.find(y=>y!==c&&norm(y.name)===norm(x.name));return`<button data-act="pick:${i}">${esc(x.name)}${ex?`<small>+ к ${fmt(ctot(ex))}</small>`:''}</button>`}).join('')}
function allNames(){const s=new Set();routeMap().forEach(x=>s.add(x.name));S.kassas.forEach(k=>!k.deleted&&k.clients.forEach(c=>c.name&&s.add(c.name.trim())));return[...s].sort((a,b)=>a.localeCompare(b,'ru'))}

/* ---------- render ---------- */
let filt='',onlyUnm=false,flashId=null;
const wide=()=>matchMedia('(min-width:900px)').matches;
let rendering=false;
function render(){if(rendering){setTimeout(render,0);return}rendering=true;try{render0()}finally{rendering=false}}
function render0(){
  // keep focus
  const ae=document.activeElement;let fk=null,fv=null,ss=null,se=null;
  if(ae&&ae.dataset&&ae.dataset.f&&!ae.closest('#sh')){fk=ae.dataset.f;fv=ae.value;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}}
  document.documentElement.dataset.theme=S.settings.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const k=K();
  renderTop(k);renderBanners(k);renderMain(k);renderBB(k);renderDrawer();
  if(fk){const el=document.querySelector(`#main [data-f="${CSS.escape(fk)}"]`);if(el){el.value=fv;el.focus({preventScroll:true});try{el.setSelectionRange(ss,se)}catch(e){}}}
  if(flashId){const el=document.querySelector(`[data-cid="${flashId}"]`);if(el){el.classList.add('flash');el.scrollIntoView({block:'center'})}flashId=null}
}
function syncDot(){return S.settings.url?`<i class="dot ${syncSt}"></i>${{ok:'сохранено в таблице',wait:'сохраняю…',err:'нет связи с таблицей',off:'нет интернета',local:'в телефоне'}[syncSt]||''}`:'<i class="dot"></i>только в этом устройстве'}
function renderTop(k){
  const el=$('#top');
  if(!k){el.innerHTML=`<div class="bar1 wrap"><button class="ib bur" data-act="drawer"><i></i></button><div class="tt"><b>Касса КМЗ</b></div></div>`;return}
  const L=live(),i=L.findIndex(x=>x.id===k.id);
  el.innerHTML=`<div class="wrap"><div class="bar1">
    <button class="ib bur" data-act="drawer" aria-label="Меню"><i></i></button>
    <button class="tt" data-act="kset" style="text-align:left"><b>${ktitle(k)}</b><span>${k.type==='week'?'касса за неделю':k.type==='day'?'касса за день':'касса за период'}${k.status==='done'?' · сдано ✓':''}${S.settings.url?` · <i class="dot ${syncSt}"></i>${{ok:'синхронизировано',wait:'сохраняю…',err:'нет связи',off:'нет интернета',local:'синхр.'}[syncSt]||''}`:''}</span></button>
    <button class="ib" data-act="undo" title="Отменить" ${undoSt.length?'':'disabled'}>↶</button>
    <button class="ib" data-act="nav:${i+1}" title="Предыдущая" ${i<L.length-1?'':'disabled'}>‹</button>
    <button class="ib" data-act="nav:${i-1}" title="Следующая" ${i>0?'':'disabled'}>›</button>
    <button class="btn v wbtn" data-act="report">Бухгалтеру</button>
  </div></div>`;
}
function heroHTML(k){const t=T(k),L=lvl(t.diff);
  return `<div class="hero"><div class="h1"><span>Забрано${t.bs!=null&&k.buh.mode==='add'?' + начало':''}</span><b>${fmt(t.target)}</b><em>${k.clients.length} клиентов · ${t.nsum} сумм</em></div>
   <div class="h2"><div class="hm"><span>Опись</span><b>${fmt(t.opis)}</b></div>
   <div class="dchip ${L}">${t.diff===0?'Сошлось ✓':sgn(t.diff)+' ₽'}</div>

function mergeInto(d){if(!d)return false;let ch=false;(d.kassas||[]).forEach(r=>{const i=S.kassas.findIndex(x=>x.id===r.id);if(i<0){S.kassas.push(r);ch=true}else if((r.upd||0)>(S.kassas[i].upd||0)){S.kassas[i]=r;ch=true}});
  if(d.clientsList&&(d.clientsList.upd||0)>(S.clientsList.upd||0)){S.clientsList=d.clientsList;ch=true}return ch}
async function pushSync(){const s=S.settings;if(!s.url||syncing)return;if(!navigator.onLine){setSync('off');return}syncing=true;
  try{const r=await fetch(s.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:s.key,data:{kassas:S.kassas,clientsList:S.clientsList}})});
    const j=await r.json();if(j.error)throw new Error(j.error);const ch=mergeInto(j.data);S.dirty=false;persist(true);setSync('ok');if(ch)render()}
  catch(e){setSync('err');console.warn(e)}finally{syncing=false}}
async function pullSync(){const s=S.settings;if(!s.url)return;if(!navigator.onLine){setSync(S.dirty?'off':'local');return}
  try{setSync('wait');const r=await fetch(s.url+(s.url.includes('?')?'&':'?')+'key='+encodeURIComponent(s.key)+'&t='+Date.now());const j=await r.json();if(j.error)throw new Error(j.error);
    const ch=mergeInto(j.data);persist(true);if(ch)render();const localNewer=S.kassas.some(x=>{const rr=(j.data.kassas||[]).find(y=>y.id===x.id);return!rr||(x.upd||0)>(rr.upd||0)});
    if(S.dirty||localNewer)pushSync();else setSync('ok')}catch(e){setSync('err');console.warn(e)}}
addEventListener('online',()=>{if(S.dirty)pushSync();else pullSync()});
setInterval(()=>{if(S.settings.url&&S.dirty)pushSync()},60000);

  case'csv':drawer(false);csv();break;
  case'theme':S.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';persist(true);render();break;
  case'logv':{drawer(false);const L=(k.log||[]).slice().reverse();openSheet(`<div class="sht"><b>Изменения после сдачи</b></div>${L.map(x=>{const d=new Date(x.t);return`<div class="log"><span>${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>${esc(x.x)}</div>`}).join('')}`,'log');break}
  case'closesh':closeSheet();break;
  // editor
  case'pick':{const[k2,c]=edCur();const x=lastSugg[+p[1]];if(!c||!x)break;const ex=k2.clients.find(y=>y!==c&&norm(y.name)===norm(x.name));
    if(ex){const vals=c.sums.filter(s=>s.a!=null&&s.a!=='');ex.sums.push(...vals);if(!vals.length)ex.sums.push({a:null,m:lastMark(ex),d:defDay(k2)});
      if(c.note)ex.note=[ex.note,c.note].filter(Boolean).join('; ');k2.clients=k2.clients.filter(y=>y!==c);shOn='ed:'+ex.id;edNew=false}
    else c.name=x.name;
    touch(k2);edRefresh();render();setTimeout(()=>{const ins=[...$('#sh').querySelectorAll('[data-e^="a:"]')];const e=ins.find(i=>!i.value)||ins[ins.length-1];e&&e.focus()},60);break}
  case'eadd':{const[k2,c]=edCur();if(!c)break;c.sums.push({a:null,m:lastMark(c),d:defDay(k2)});touch(k2);edRefresh();const ins=$('#sh').querySelectorAll('[data-e^="a:"]');ins.length&&ins[ins.length-1].focus();break}
  case'em':{const[k2,c]=edCur();if(!c)break;const s=c.sums[+p[1]];s.m=s.m===p[2]?'':p[2];touch(k2);edRefresh();render();break}
  case'eall':{const[k2,c]=edCur();if(!c)break;c.sums.forEach(s=>s.m=p[1]||'');touch(k2);edRefresh();render();break}
  case'edel':{const[k2,c]=edCur();if(!c)break;const s=c.sums[+p[1]];c.sums.splice(+p[1],1);logc(k2,c.name+': удалена сумма '+fmt(+s.a||0));touch(k2);edRefresh();render();break}
  case'edelc':{const[k2,c]=edCur();if(!c)break;if(!c.name&&!ctot(c)||confirm('Удалить «'+(c.name||'без имени')+'»?')){k2.clients=k2.clients.filter(x=>x!==c);logc(k2,'Удалён клиент '+c.name);touch(k2);shOn=null;closeSheet()}break}
  }});
$('#scr').onclick=()=>drawer(false);
$('#shs').onclick=()=>closeSheet();
function saveSettings(){const sh=$('#sh');if(!sh)return;sh.querySelectorAll('[data-st]').forEach(e=>{const f=e.dataset.st;if(f==='clients'){if(e.value!==S.clientsList.text){S.clientsList={text:e.value,upd:Date.now()}}}else S.settings[f]=f==='url'||f==='key'?e.value.trim():e.value});persist()}

// inputs
let focusSnap=null;
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&(t.dataset.f||t.dataset.e)){const k=K();if(k&&!locked(k)&&focusSnap!==t){if(t.dataset.f)snap();focusSnap=t}}});
document.addEventListener('input',e=>{const t=e.target,k=K();
  if(t.dataset.act2==='filt'){filt=t.value;const pos=t.selectionStart;render();const n=$('[data-act2="filt"]');n.focus();n.setSelectionRange(pos,pos);return}
  if(t.dataset.s==='q'){sq=t.value;doSearch();return}
  if(t.dataset.e){const[k2,c]=edCur();if(!c)return;const[f,i]=t.dataset.e.split(':');
    if(f==='name')c.name=t.value;else if(f==='note')c.note=t.value;else if(f==='a'){const s=c.sums[+i];s.a=t.value.trim()===''?null:pnum(t.value);}else if(f==='d')c.sums[+i].d=t.value;
    const te=$('#edTot');if(te)te.textContent=fmt(ctot(c));if(f==='a'){const w=$('#w'+i),x=sumWarn(k2,c,+i);if(w)w.innerHTML=x?`<div class="wn">⚠ ${esc(x)}</div>`:''}
    if(f==='name'){const sg=$('#sugg');if(sg)sg.innerHTML=suggHTML(k2,c);const d=dupCheck(k2,c);$('#edDup').innerHTML=d?`<div class="note" style="color:var(--amb)">⚠ «${esc(d.name)}» уже есть в этой кассе — при «Готово» предложу объединить</div>`:''}
    touch(k2);render();return}
  if(!t.dataset.f||!k)return;const[f,a,b]=t.dataset.f.split(':');
  if(f==='dens'){const v=pnum(t.value);k.opis[a]=v==null?null:Math.max(0,Math.round(v/ +a*1000)/1000)}
  else if(f==='den'){k.opis[a]=t.value===''?null:Math.max(0,parseInt(t.value.replace(/\D/g,''))||0)}
  else if(f==='coins')k.coins=pnum(t.value);
  else if(f==='cardm')k.cardManual=pnum(t.value);
  else if(f==='outa'){const o=k.out.find(x=>x.id===a);o.a=pnum(t.value)}
  else if(f==='outn'){const o=k.out.find(x=>x.id===a);o.name=t.value}
  else if(f==='cname'){const c=k.clients.find(x=>x.id===a);c.name=t.value}
  else if(f==='sum'){const c=k.clients.find(x=>x.id===a);const j=+b;const v=t.value.trim()===''?null:pnum(t.value);
    if(j<c.sums.length)c.sums[j].a=v;else if(v!=null)c.sums.push({a:v,m:lastMark(c),d:defDay(k)});}
  else if(f==='newc')return;
  touch(k);render()});
document.addEventListener('change',e=>{const t=e.target,k=K();
  if(t.dataset.act2==='sort'){S.settings.sort=t.value;persist(true);render();return}
  if(t.dataset.st){saveSettings();if(t.dataset.st==='url'||t.dataset.st==='key')pullSync();return}
  if(t.dataset.e){return}
  if(!t.dataset.f||!k)return;const[f,a,b]=t.dataset.f.split(':');
  if(f==='sum'){const c=k.clients.find(x=>x.id===a);if(c){const j=+b;const old=c.sums[j];if(old&&(old.a==null)){c.sums.splice(j,1);touch(k);render()}else logc(k,c.name+': сумма '+(j+1)+' = '+fmt(old?old.a:0))}}
  if(f==='cname'){const c=k.clients.find(x=>x.id===a);c.name=cap(c.name);const d=dupCheck(k,c);
    if(d&&confirm(`«${d.name}» уже есть. Добавить суммы «${c.name}» к нему?`)){d.sums.push(...c.sums);k.clients=k.clients.filter(x=>x!==c);logc(k,'Объединён дубль '+d.name)}touch(k);render()}
  if(f==='newc'){const name=cap(t.value);if(!name)return;const d=k.clients.find(x=>norm(x.name)===norm(name));
    if(d&&confirm(`«${d.name}» уже есть в кассе. Перейти к нему и добавить сумму?`)){t.value='';render();const el=document.querySelector(`[data-f="sum:${d.id}:${d.sums.length}"]`);el&&el.focus();return}
    snap();const c={id:uid(),name,sums:[],note:''};k.clients.push(c);touch(k,'Добавлен клиент '+name);t.value='';render();const el=document.querySelector(`[data-f="sum:${c.id}:0"]`);el&&el.focus()}
  if(f==='coins'||f==='outa'||f==='cardm')render();
  if(k.status==='done'&&k.unlocked&&(f==='den'||f==='coins'||f==='outa'))logc(k,'Опись: '+(f==='den'?a+' × '+t.value:f==='coins'?'монеты '+t.value:'выдано '+t.value));
  persist()});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||t.dataset.r==null)return;
  const r=+t.dataset.r,c=+t.dataset.c;let nr=null;
  if(e.key==='Enter'||e.key==='ArrowDown')nr=r+1;else if(e.key==='ArrowUp')nr=r-1;else return;
  e.preventDefault();if(t.dataset.f==='newc'&&e.key==='Enter'){t.blur();return}
  t.blur();setTimeout(()=>{const n=document.querySelector(`#main [data-r="${nr}"][data-c="${c}"]`)||document.querySelector(`#main [data-r="${nr}"][data-c="0"]`);n&&n.focus()},0)});
$('#fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const n0=live().length;
    if(!d.kassas)throw 0;d.kassas.forEach(r=>{const i=S.kassas.findIndex(x=>x.id===r.id);if(i<0)S.kassas.push(r);else if((r.upd||0)>=(S.kassas[i].upd||0))S.kassas[i]=r});
    if(d.clientsList&&d.clientsList.text&&(!S.clientsList.text||(d.clientsList.upd||0)>(S.clientsList.upd||0)))S.clientsList=d.clientsList;
    S.cur=null;persist();closeSheet();toast('Загружено. Касс: '+live().length+(live().length>n0?' (+'+(live().length-n0)+')':''))}catch(err){toast('Не тот файл')}e.target.value=''};
matchMedia('(min-width:900px)').addEventListener('change',()=>render());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.settings.theme)render()});
// swipe drawer
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(tx<24&&dx>70)drawer(true);if($('#dr').classList.contains('on')&&dx<-70)drawer(false);tx=null},{passive:true});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const m=location.hash.match(/sync=([^&]+)/);if(m){try{const v=decodeURIComponent(escape(atob(decodeURIComponent(m[1])))).split('|');S.settings.url=v[0];S.settings.key=v[1]||'';persist(true);toast('Синхронизация подключена')}catch(e){toast('Ссылка синхронизации не подошла')}history.replaceState(null,'',location.pathname)}})();
syncSt=S.settings.url?(S.dirty?'wait':'local'):'local';
setInterval(()=>{if(S.settings.url&&document.visibilityState==='visible'&&!syncing&&!S.dirty&&!document.activeElement.matches('input,textarea,select'))pullSync()},30000);
render();if(S.settings.url)pullSync();
</script>
</body>
